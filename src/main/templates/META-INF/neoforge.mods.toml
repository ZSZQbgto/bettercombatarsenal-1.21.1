modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="BetterCombat:NeonArsenal"
authors="zszq"
description='''
A new-generation combat weapon kit by Aurora Industries, adding melee weapons whose
attack animations are supplied by
Better Combat weapon presets. Weapon definitions are data-driven, so the arsenal can grow
without touching the registration code.
'''

# Optional Better Combat integration: the jump-attack override mixin is only applied when Better
# Combat is loaded (guarded by a mixin config plugin inside the config).
[[mixins]]
    config="bettercombat_neonarsenal.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required dependency: the arsenal weapons use Better Combat attack presets, hit boxes and
# two-handed rules (linked through data/bettercombat_neonarsenal/weapon_attributes/<weapon>.json).
[[dependencies.${mod_id}]]
    modId="bettercombat"
    type="required"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"
    reason="Required: provides the melee attack animation presets used by the arsenal weapons."
